# PiKVM main configuration
# Use override.yaml to modify required settings.

logging: !include logging.yaml

kvmd:
    auth:
        internal:
            file: /etc/kvmd/empty_file

    info:
        meta: /etc/kvmd/meta.yaml
        fan:
            unix: /run/kvmd/fan.sock

    hid:
        mouse:
            absolute: false
        type: otg

    atx:
        type: gpio

    msd:
        type: otg

    streamer:
        h264_bitrate:
            default: 5000
        cmd:
            - "{ustreamer_bin}"
            - "--device=/dev/kvmd-video"
            - "--persistent"
            - "--dv-timings"
            - "--format=uyvy"
            - "--encoder=m2m-image"
            - "--buffers=6"
            - "--workers=3"
            - "--quality={quality}"
            - "--desired-fps={desired_fps}"
            - "--drop-same-frames=30"
            - "--unix={unix}"
            - "--unix-rm"
            - "--unix-mode=0660"
            - "--exit-on-parent-death"
            - "--process-name-prefix={process_name_prefix}"
            - "--notify-parent"
            - "--no-log-colors"
            - "--jpeg-sink=kvmd::ustreamer::jpeg"
            - "--jpeg-sink-mode=0660"
            - "--h264-sink=kvmd::ustreamer::h264"
            - "--h264-sink-mode=0660"
            - "--h264-bitrate={h264_bitrate}"
            - "--h264-gop={h264_gop}"

    gpio:
        scheme:
            __v3_usb_breaker__:
                pin: 5
                mode: output
                initial: true
                pulse: false

vnc:
    memsink:
        jpeg:
            sink: "kvmd::ustreamer::jpeg"
        h264:
            sink: "kvmd::ustreamer::h264"
