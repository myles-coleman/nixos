name: PR Build & Diff

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "$base"...HEAD | grep -qE '(\.nix$|^flake\.lock$|^\.sops\.yaml$|^secrets/|^scripts/|^\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-x86:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        host: [bee-pc, bee-gpd, homelab, bee-gpu-server, protecli-vault]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: nixos-monorepo
          useDaemon: true
      - name: Build ${{ matrix.host }}
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --flake .#packages.x86_64-linux.${{ matrix.host }} \
            --skip-cached --no-nom

  build-arm:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        host: [pikvm, node0, node1, node2, node3, node4, rpi3]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Free disk space
        # node0-node3 build the aarch64 kernel + full system closure from
        # source (their page-size-16k overlay misses every binary cache), which
        # exceeds the runner's default disk. Free the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: nixos-monorepo
          useDaemon: true
      - name: Build ${{ matrix.host }}
        run: |
          nix run nixpkgs#nix-fast-build -- \
            --flake .#packages.aarch64-linux.${{ matrix.host }} \
            --skip-cached --no-nom

  pin-guard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify root nixpkgs is aligned with nixos-raspberrypi
        run: scripts/repin-nixpkgs-from-rpi.sh

  closure-diff:
    needs: [changes, build-x86]
    if: needs.changes.outputs.code == 'true' && needs.build-x86.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Spec 21, Unit 1. This job used to SSH into the live hosts over Tailscale and
    # read /run/current-system, which put the deploy SSH key and the Tailscale OAuth
    # pair inside a `pull_request` workflow — the exact secret surface a PR job must
    # not have. The base closure is now built in CI from the PR's base ref, so the
    # job needs no host access and no long-lived credential.
    #
    # Cost: this doubles the x86 build work per PR. Both sides substitute from the
    # public nixos-monorepo cache, so a warm cache keeps it cheap and a cold cache
    # makes it the slowest job. The base build is bounded by `timeout`, and a base
    # failure degrades to a warning so it cannot block a PR on infrastructure alone.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nixos-raspberrypi.cachix.org
            extra-trusted-public-keys = nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
      - name: Setup Cachix
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: nixos-monorepo
          useDaemon: true
      - name: Build and diff base vs PR closures
        id: diff
        shell: bash
        run: |
          set +e
          # Server hosts only: desktops (bee-pc/bee-gpd) never auto-deploy.
          HOSTS="homelab bee-gpu-server protecli-vault"
          DIFF_DIR=$(mktemp -d)

          # Materialise the base revision as a detached worktree so both closures can
          # be evaluated from one runner without touching the PR checkout.
          BASE_DIR="${RUNNER_TEMP}/base"
          rm -rf "$BASE_DIR"
          if ! git worktree add --detach "$BASE_DIR" "origin/${{ github.base_ref }}"; then
            echo "base-worktree-failed" > "${DIFF_DIR}/fatal"
          fi

          for host in $HOSTS; do
            echo "::group::${host}"

            if [ -f "${DIFF_DIR}/fatal" ]; then
              echo "base-build-failed" > "${DIFF_DIR}/status-${host}"
              echo "base revision unavailable; diff skipped"
              echo "::endgroup::"; continue
            fi

            if ! new_path=$(timeout 1800 nix build ".#packages.x86_64-linux.${host}" --print-out-paths --no-link -L); then
              echo "build-failed" > "${DIFF_DIR}/status-${host}"
              echo "::endgroup::"; continue
            fi

            if ! base_out=$(cd "$BASE_DIR" && timeout 1800 nix build ".#packages.x86_64-linux.${host}" --print-out-paths --no-link -L 2>&1); then
              # A base build failure is an infrastructure problem, not a defect in
              # this PR. Warn and skip rather than failing the required gate.
              echo "::warning::base closure build failed for ${host}; diff skipped"
              echo "base-build-failed" > "${DIFF_DIR}/status-${host}"
              echo "::endgroup::"; continue
            fi
            base_path=$(printf '%s\n' "$base_out" | tail -1)

            nix path-info -r "$new_path" | sed 's|^/nix/store/[a-z0-9]\{32\}-||' | sort -u > "${DIFF_DIR}/new-${host}.txt"
            nix path-info -r "$base_path" | sed 's|^/nix/store/[a-z0-9]\{32\}-||' | sort -u > "${DIFF_DIR}/base-${host}.txt"

            removed=$(comm -23 "${DIFF_DIR}/base-${host}.txt" "${DIFF_DIR}/new-${host}.txt")
            added=$(comm -13 "${DIFF_DIR}/base-${host}.txt" "${DIFF_DIR}/new-${host}.txt")
            if [ -z "$removed" ] && [ -z "$added" ]; then
              echo "no-changes" > "${DIFF_DIR}/status-${host}"
            else
              echo "changed" > "${DIFF_DIR}/status-${host}"
              { [ -n "$removed" ] && echo "$removed" | sed 's/^/- /'; [ -n "$added" ] && echo "$added" | sed 's/^/+ /'; } > "${DIFF_DIR}/diff-${host}.txt"
            fi
            echo "::endgroup::"
          done

          COMMENT_FILE="${DIFF_DIR}/comment.md"
          {
            echo '<!-- nixos-diff -->'
            echo '## NixOS Config Diff'
            echo ''
            echo "Base: \`${{ github.base_ref }}\` built in CI. No host access."
            echo ''
            for host in $HOSTS; do
              status=$(cat "${DIFF_DIR}/status-${host}" 2>/dev/null || echo unknown)
              case "$status" in
                changed)
                  added_count=$(grep -c '^+ ' "${DIFF_DIR}/diff-${host}.txt" || true)
                  removed_count=$(grep -c '^- ' "${DIFF_DIR}/diff-${host}.txt" || true)
                  echo "### ${host} — ${added_count} added, ${removed_count} removed"
                  echo ''; echo '```diff'
                  lines=$(wc -l < "${DIFF_DIR}/diff-${host}.txt")
                  if [ "$lines" -gt 80 ]; then head -80 "${DIFF_DIR}/diff-${host}.txt"; echo "... and $((lines - 80)) more packages"; else cat "${DIFF_DIR}/diff-${host}.txt"; fi
                  echo '```'; echo ''
                  ;;
                no-changes) echo "### ${host} — no changes"; echo '' ;;
                base-build-failed) echo "### ${host} — base build failed, diff skipped"; echo '' ;;
                build-failed) echo "### ${host} — PR build failed"; echo '' ;;
              esac
            done
          } > "$COMMENT_FILE"
          echo "comment_file=${COMMENT_FILE}" >> "$GITHUB_OUTPUT"
      - name: Post PR comment
        if: always() && steps.diff.outputs.comment_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          file="${{ steps.diff.outputs.comment_file }}"
          [ -f "$file" ] || exit 0
          existing=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- nixos-diff -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$file" '{"body": $body}' | gh api "repos/${{ github.repository }}/issues/comments/${existing}" -X PATCH --input -
          else
            gh pr comment "$pr" --body-file "$file"
          fi

  gate:
    if: always()
    needs: [changes, build-x86, build-arm, pin-guard, closure-diff]
    runs-on: ubuntu-latest
    steps:
      - name: Require build and guard jobs to pass or skip
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD_X86: ${{ needs.build-x86.result }}
          BUILD_ARM: ${{ needs.build-arm.result }}
          PIN_GUARD: ${{ needs.pin-guard.result }}
          CLOSURE_DIFF: ${{ needs.closure-diff.result }}
        run: |
          set -euo pipefail
          fail=0
          for result in "$CHANGES" "$BUILD_X86" "$BUILD_ARM" "$PIN_GUARD" "$CLOSURE_DIFF"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required job result: $result"; fail=1 ;;
            esac
          done
          [ "$fail" = 0 ] || exit 1
          echo "All required jobs passed or were skipped."
