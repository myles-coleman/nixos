name: PR Diff Comment

on:
  workflow_run:
    workflows: ["PR Build & Diff"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # Checkout the base repository only. The PR head is never fetched and the
      # downloaded artifact is treated as data, never executed.
      - name: Checkout base repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download diff comment artifact
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: nixos-diff-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/comment
      - name: Post or update PR comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ github.event.workflow_run.pull_requests[0].number }}"
          file="${{ runner.temp }}/comment/comment.md"
          [ -f "$file" ] || exit 0
          existing=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- nixos-diff -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$file" '{"body": $body}' | gh api "repos/${{ github.repository }}/issues/comments/${existing}" -X PATCH --input -
          else
            gh pr comment "$pr" --body-file "$file"
          fi
