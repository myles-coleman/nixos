name: Build images

# Builds the amd64 sandbox image (spec 20, Unit 4) and the multi-arch allowlisting
# squid image (spec 20, Unit 3) and pushes them to GHCR. Both job digests are
# printed in the run summary so they can be pinned in ~/homelab-cluster.
#
# GHCR is authenticated with the workflow's own GITHUB_TOKEN, so no personal
# credential (and no `write:packages` OAuth scope) is needed.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - opencode-sandbox
          - squid
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yaml'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.gen.outputs.images }}
    steps:
      - name: Build image matrix
        id: gen
        env:
          EVENT: ${{ github.event_name }}
          INPUT_IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          all='[
            {"name":"opencode-sandbox","context":"./images/opencode-sandbox","platforms":"linux/amd64"},
            {"name":"squid","context":"./images/squid","platforms":"linux/amd64,linux/arm64"}
          ]'
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_IMAGE" != "all" ]; then
            all=$(jq -c --arg n "$INPUT_IMAGE" '[.[] | select(.name == $n)]' <<<"$all")
          fi
          # GITHUB_OUTPUT needs a single-line value.
          all=$(jq -c . <<<"$all")
          echo "images=$all" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-qemu-action@v3.7.0

      - uses: docker/setup-buildx-action@v3.12.0

      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: version
        run: |
          set -euo pipefail
          case "${{ matrix.image.name }}" in
            opencode-sandbox) tag=2.0.23 ;;
            squid) tag=6.14 ;;
            *) echo "unknown image ${{ matrix.image.name }}" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # opencode-sandbox only: build the exact image locally, run its pinned
      # toolchain check (spec 30, FR-56 / FR-57), then push. Nothing is pushed
      # until /opt/sandbox/check-tools.sh passes.
      - name: Build opencode-sandbox for verification
        if: matrix.image.name == 'opencode-sandbox'
        id: build-verify
        uses: docker/build-push-action@v6.19.2
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/opencode-sandbox:${{ steps.version.outputs.tag }}-verify

      - name: Verify opencode-sandbox toolchain
        if: matrix.image.name == 'opencode-sandbox'
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/opencode-sandbox:${{ steps.version.outputs.tag }}-verify"
          # The image entrypoint is `opencode`, so the check must replace it
          # rather than arrive as an argument to the agent CLI.
          docker run --rm --entrypoint /opt/sandbox/check-tools.sh "$image"

      - name: Push verified opencode-sandbox image
        if: matrix.image.name == 'opencode-sandbox'
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/opencode-sandbox"
          tag="${{ steps.version.outputs.tag }}"
          docker tag "$image:$tag-verify" "$image:$tag"
          docker push "$image:$tag"

      - name: Record opencode-sandbox digest
        if: matrix.image.name == 'opencode-sandbox'
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/opencode-sandbox"
          tag="${{ steps.version.outputs.tag }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")
          echo "digest=$digest"
          {
            echo "### opencode-sandbox"
            echo '```'
            echo "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        id: build
        if: matrix.image.name != 'opencode-sandbox'
        uses: docker/build-push-action@v6.19.2
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.version.outputs.tag }}

      - name: Record digest
        if: matrix.image.name != 'opencode-sandbox'
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}"
          echo "digest=${{ steps.build.outputs.digest }}"
          {
            echo "### ${{ matrix.image.name }}"
            echo '```'
            echo "${ref}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
