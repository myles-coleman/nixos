name: Renovate

# Self-hosted Renovate for flake.lock.
#
# It has to be self-hosted: Renovate's nix manager delegates lock-file work to
# the package manager as an external command, and the Mend-hosted app fails to
# install a `nix` binary on its runners. So the job installs Nix and runs the
# CLI directly rather than the Renovate action container.
#
# One PR per flake input, deliberately. A combined `nix flake update` over 19
# inputs cannot be bisected when the host build matrix fails; a per-input PR
# leaves one suspect. Grouping would put us back to all-or-nothing.
#
# Authentication is a GitHub App installation token minted per run, not a PAT:
#   - pull requests it opens DO trigger workflows. GITHUB_TOKEN does not, so
#     pr.yaml would never build the hosts on a Renovate PR.
#   - the App needs Workflows: write, because Renovate bumps the `uses:` pins in
#     this directory and GitHub rejects a push touching .github/workflows/**
#     without it.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  RENOVATE_VERSION: 44.257.9

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Environment secret, not a repository secret: a pull_request job cannot read
    # a write-capable credential. `main` only, and deliberately no required
    # reviewers, which would stall every scheduled run.
    environment: renovate
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        # Renovate shells out to `nix` for flake.lock updates, so this is the
        # dependency the hosted app cannot satisfy.
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: myles-coleman
          repositories: nixos

      - name: Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_USERNAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          RENOVATE_GIT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ vars.RENOVATE_APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          RENOVATE_REPOSITORIES: '["myles-coleman/nixos"]'
          LOG_LEVEL: info
        run: npx --yes "renovate@${RENOVATE_VERSION}"
