creation_rules:
  # Legacy single-file ciphertext, retained until task 2.0 retires it.
  - path_regex: ^secrets/secrets\.yaml$
    key_groups:
      - age:
          - *admin
  # Shared material (Tailscale auth key, k3s server token). k3s recipients are
  # added in task 3.5.
  - path_regex: ^secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *homelab
          - *protecli-vault
          - *node0
          - *node1
          - *node2
          - *node3
          - *node4
  # Host-unique material.
  - path_regex: ^secrets/hosts/bee-pc\.yaml$
    key_groups:
      - age: [*admin, *bee-pc]
  - path_regex: ^secrets/hosts/bee-gpd\.yaml$
    key_groups:
      - age: [*admin, *bee-gpd]
  - path_regex: ^secrets/hosts/homelab\.yaml$
    key_groups:
      - age: [*admin, *homelab]
  - path_regex: ^secrets/hosts/bee-gpu-server\.yaml$
    key_groups:
      - age: [*admin, *bee-gpu-server]
  - path_regex: ^secrets/hosts/protecli-vault\.yaml$
    key_groups:
      - age: [*admin, *protecli-vault]
  - path_regex: ^secrets/hosts/pikvm\.yaml$
    key_groups:
      - age: [*admin, *pikvm]
  - path_regex: ^secrets/hosts/rpi3\.yaml$
    key_groups:
      - age: [*admin, *rpi3]
